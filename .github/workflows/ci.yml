name: "Build 🔨"

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!Translations/*.lproj/**'
      - 'Translations/en.lproj/**'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [ main ]
  # Fork-friendly manual trigger: GitHub disables Actions on forks by default,
  # so a push may not run CI until the owner enables Actions in the fork's
  # Settings/Actions tab. Once enabled, the workflow can be run on demand.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Needed by the publish job to create GitHub Releases for the .ipa.
permissions:
  contents: write

jobs:
  build:
    name: "Build 🔨"
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        scheme:
          - "Swiftfin"
          # tvOS build paused 2026-10-21 to halve Actions macOS-minute burn.
          # Re-add "Swiftfin tvOS" when needed; testflight.yml still builds it
          # on demand (dispatch with platform: tvOS).

    # xcode-27 = GitHub-hosted macOS 27 image (Xcode 27.1 default). Bumped from
    # macos-26/26.6 2026-11-14: MediaAccessibilityKit 0.4.0 (upstream dep) fails
    # to compile on Xcode 26.6 ('sending' region-isolation error) and builds
    # green on 27.1, same image testflight.yml already uses. Preview label, not
    # Spec's Mac.
    runs-on: xcode-27

    env:
      XCODE_VERSION: "27.1"
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "2"

    outputs:
      version: ${{ steps.package.outputs.version }}
      build: ${{ steps.package.outputs.build }}
      asset: ${{ steps.package.outputs.asset }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Homebrew dependencies
        run: brew bundle --file Brewfile

      - name: Restore Swift packages
        id: swift-packages
        uses: actions/cache/restore@v6
        with:
          path: |
            build/SourcePackages/checkouts
            build/SourcePackages/repositories
            build/SourcePackages/artifacts
            build/SourcePackages/workspace-state.json
          key: spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ matrix.scheme }}-${{ hashFiles('Swiftfin.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ matrix.scheme }}-

      - name: Build
        uses: nick-fields/retry@v4
        env:
          SCHEME: ${{ matrix.scheme }}
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 60
          command: |
            # Fork adjustment: no xcodeVersion argument. The self-hosted
            # xcode-27 runner ships a single system Xcode and has no `xcodes`
            # CLI, which fastlane's xcodes action requires. The system toolchain
            # (Xcode 27.x) satisfies this tree; passing the version would fail.
            bundle exec fastlane buildLane \
              "scheme:$SCHEME"

      - name: Save Swift packages
        if: ${{ github.event_name == 'push' && steps.swift-packages.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            build/SourcePackages/checkouts
            build/SourcePackages/repositories
            build/SourcePackages/artifacts
            build/SourcePackages/workspace-state.json
          key: ${{ steps.swift-packages.outputs.cache-primary-key }}

      - name: Package unsigned IPA
        id: package
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -euo pipefail
          # Hub-site release scheme (shared with key-decoder/pianobar/YouTubePlus):
          # bundle version = build date + run number, yy.m.d-<run>. fastlane
          # buildLane does not forward build settings, so this staged-PlistBuddy
          # stamp is the SINGLE version mechanism for this repo.
          APP_VERSION=$(date -u +%y.%-m.%-d)
          APP_BUILD=$GITHUB_RUN_NUMBER
          ASSET="$SCHEME-$APP_VERSION-$APP_BUILD.ipa"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$APP_BUILD" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          mkdir -p fastlane/build/Payload
          cp -R fastlane/build/*.xcarchive/Products/Applications/*.app fastlane/build/Payload/
          APP=$(find fastlane/build/Payload -maxdepth 1 -name '*.app' | head -1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUILD" "$APP/Info.plist"
          cd fastlane/build
          zip -r -y "$ASSET" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.asset }}
          path: fastlane/build/*.ipa
          if-no-files-found: error
          compression-level: 0

  publish:
    name: "Publish .ipa 🚀"
    # Main builds / manual dispatch only: self-hosted runners must never
    # execute unreviewed fork code on Spec's Mac (same guard as key-decoder).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: [self-hosted, nuclear-mac]

    env:
      # LaunchAgent services get a minimal PATH; Homebrew gh and /usr/bin/jq
      # are not a macOS login-session guarantee.
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      VERSION: ${{ needs.build.outputs.version }}
      BUILD: ${{ needs.build.outputs.build }}
      ASSET: ${{ needs.build.outputs.asset }}

    steps:
      - name: Download unsigned .ipa
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.asset }}
          path: out

      - name: Publish GitHub Release (bare .ipa, newest-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One release per main build; tag + title identical to the version
          # stamped into the bundle. --latest keeps releases/latest (the hub
          # site download button) pointing at the newest build.
          TAG="$VERSION-$BUILD"
          FILE="out/$ASSET"
          ls -lh "$FILE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Swiftfin $VERSION ($BUILD)" \
              --latest \
              --notes "Build $BUILD of $VERSION — custom fork of jellyfin/Swiftfin. Unsigned .ipa: re-sign with Sideloadly / AltStore / Xcode using your Apple ID to install."
          fi
          # Newest-only policy (2026-11-14, Spec standing rule): hub + iCloud
          # keep ONLY the current build. Prune superseded versioned releases
          # (the yy.m.d-<run> pattern never touches upstream 1.x tags or any
          # other release shape).
          OLD_TAGS=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                      --jq '.[].tag_name' \
                    | grep -E '^[0-9]{2}\.[0-9]+\.[0-9]+-[0-9]+$' \
                    | grep -v -x "$TAG" || true)
          for OLD in $OLD_TAGS; do
            echo "Pruning superseded release $OLD"
            gh release delete "$OLD" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

      - name: Mirror .ipa to iCloud Drive
        continue-on-error: true
        run: |
          # This runner IS Spec's Mac, so a local copy into iCloud Drive IS
          # the upload (bird syncs it within seconds; no cron, no tokens).
          # continue-on-error: a sync hiccup must never redden a build — the
          # GitHub Release stays the canonical download.
          DEST="$HOME/Library/Mobile Documents/com~apple~CloudDocs/IPAs"
          mkdir -p "$DEST"
          cp -f "out/$ASSET" "$DEST/$ASSET"
          # Newest-only policy: drop superseded Swiftfin builds from the
          # shared collection folder (Swiftfin prefix only — other apps'
          # files are pruned by their own pipelines).
          find "$DEST" -maxdepth 1 -type f -name 'Swiftfin*.ipa' ! -name "$ASSET" -delete
          ls -lh "$DEST"
